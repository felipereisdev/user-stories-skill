name: Plan Lint
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Linter tests
        run: python -m unittest discover -s tests -v
      - name: Lint the example plans
        run: python scripts/lint_plan.py --new --skip-files example-output.md example-gherkin-output.md
